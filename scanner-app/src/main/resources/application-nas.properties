# Chế độ chạy trên Windows: có thể chọn mọi ổ/thư mục mà tài khoản hiện tại có quyền truy cập.
server.port=18080
server.address=127.0.0.1
scanner.storage.restricted=false
# Các đường dẫn NAS dưới đây chỉ là gợi ý cấu hình cũ; app không giới hạn vào NAS.
scanner.storage.images-root=\\\\192.168.1.8
scanner.storage.images-unrestricted=true
scanner.storage.reports-root=\\\\192.168.1.8\\filebaocao
# Word và ảnh có thể dùng mọi thư mục mà Windows cho phép ghi/đọc.
scanner.storage.reports-unrestricted=true
# Ảnh chụp từ camera được tự lưu vào thư mục này
scanner.storage.captures-root=C:/ScannerData/Captures
server.servlet.session.timeout=8h
