spring.application.name=Scanner App
server.port=8080
server.address=0.0.0.0

# Upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# OCR daemon (nạp model 1 lần để mỗi lần quét không phải nạp lại)
scanner.ocr.server-enabled=true
scanner.ocr.server-port=18081

# Ảnh chụp từ camera được tự lưu vào thư mục này trên máy chạy app
scanner.storage.captures-root=C:/ScannerData/Captures