spring.application.name=Scanner App
server.port=8080
server.address=0.0.0.0

# Upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# Excel PO nằm trên máy đang chạy web app. Khi chuyển từ Lenovo sang server công ty,
# chỉ cần đổi đường dẫn này; điện thoại vẫn chọn file qua giao diện web như cũ.
scanner.excel.root=C:/ScannerData/Excel
